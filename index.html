<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--bg:#f7f5f0;--surface:#fff;--surface2:#f0ede6;--border:#e2ddd4;--ink:#1a1814;--ink2:#6b6560;--ink3:#9e9891;--green:#2d6a4f;--green-bg:#edf7f2;--green-light:#52b788;--red:#c1440e;--red-bg:#fdf0eb;--gold:#b5890a;--gold-bg:#fdf8ec;--accent:#1a3c5e;--brk:#7c4f1e;--brk-bg:#fdf4ec;--mono:"DM Mono",monospace;--sans:"DM Sans",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;}
header{background:var(--accent);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo-main{font-family:var(--mono);font-size:16px;color:#fff;letter-spacing:1px;}
.logo-sub{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase;}
.last-upd{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,0.4);max-width:140px;text-align:right;line-height:1.4;}
.refresh-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.8);padding:6px 14px;border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:1px;flex-shrink:0;}
.refresh-btn.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.summary-bar{background:var(--accent);border-top:1px solid rgba(255,255,255,0.1);padding:10px 20px;display:flex;gap:18px;overflow-x:auto;}
.s-stat{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
.s-lbl{font-family:var(--mono);font-size:8px;color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase;}
.s-val{font-family:var(--mono);font-size:14px;color:#fff;}
.s-val.g{color:#74c69d;}.s-val.r{color:#f4a261;}.s-val.y{color:#ffd166;}.s-val.brk{color:#f5c891;}
.tabs{background:var(--surface);border-bottom:2px solid var(--border);display:flex;}
.tab-btn{flex:1;padding:10px;background:transparent;color:var(--ink2);border:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:1px;border-bottom:2px solid transparent;margin-bottom:-2px;}
.tab-btn.active{background:var(--accent);color:#fff;border-bottom:2px solid var(--accent);}
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.f-lbl{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:1px;margin-right:2px;}
.f-btn{background:transparent;border:1px solid var(--border);color:var(--ink2);padding:5px 12px;border-radius:20px;cursor:pointer;font-family:var(--sans);font-size:12px;transition:all 0.15s;}
.f-btn:hover{border-color:var(--accent);color:var(--accent);}
.f-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.f-btn.brk-f{border-color:var(--brk);color:var(--brk);}
.f-btn.brk-f.active{background:var(--brk);border-color:var(--brk);color:#fff;}
.grid{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:box-shadow 0.2s;}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.07);}
.card.brk{border-color:#c8956a;border-width:2px;}
.brk-badge{display:inline-flex;align-items:center;gap:3px;background:var(--brk-bg);color:var(--brk);font-family:var(--mono);font-size:8px;padding:2px 6px;border-radius:3px;border:1px solid #c8956a;margin-left:6px;vertical-align:middle;}
.card-hdr{padding:12px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border);}
.ticker{font-family:var(--mono);font-size:18px;color:var(--ink);font-weight:500;}
.s-tag{font-family:var(--mono);font-size:8px;color:var(--ink3);background:var(--surface2);padding:2px 6px;border-radius:3px;text-transform:uppercase;margin-left:5px;vertical-align:middle;}
.cname{font-size:11px;color:var(--ink3);margin-top:2px;}
.price-blk{text-align:right;}
.cprice{font-family:var(--mono);font-size:18px;}
.cchg{font-family:var(--mono);font-size:10px;margin-top:1px;}
.up{color:var(--green);}.dn{color:var(--red);}
.sec-t{font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:1.5px;text-transform:uppercase;padding:6px 16px 4px;background:var(--surface2);border-bottom:1px solid var(--border);}
.fg{padding:8px 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;border-bottom:1px solid var(--border);}
.fi{display:flex;flex-direction:column;gap:1px;}
.fl{font-family:var(--mono);font-size:8px;color:var(--ink3);text-transform:uppercase;}
.fv{font-family:var(--mono);font-size:12px;}
.fv.g{color:var(--green);}.fv.r{color:var(--red);}.fv.y{color:var(--gold);}.fv.n{color:var(--ink2);}
.score-wrap{padding:8px 16px;border-bottom:1px solid var(--border);}
.score-hdr{display:flex;justify-content:space-between;margin-bottom:4px;}
.score-lbl{font-family:var(--mono);font-size:8px;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;}
.score-num{font-family:var(--mono);font-size:11px;font-weight:500;}
.bar-bg{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;transition:width 0.5s ease;}
.earn-row{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.earn-info{font-family:var(--mono);font-size:10px;color:var(--ink2);}
.earn-badge{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:10px;background:var(--gold-bg);color:var(--gold);}
.earn-badge.soon{background:var(--red-bg);color:var(--red);}
.dot-row{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.dot{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;font-weight:500;}
.dot.beat{background:var(--green-bg);color:var(--green);}
.dot.miss{background:var(--red-bg);color:var(--red);}
.div-row{padding:8px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.div-info{font-family:var(--mono);font-size:10px;color:var(--ink2);}
.div-b{font-family:var(--mono);font-size:9px;padding:2px 8px;border-radius:10px;}
.div-b.a{background:var(--gold-bg);color:var(--gold);}
.div-b.d{background:var(--green-bg);color:var(--green);}
.div-b.n{background:var(--surface2);color:var(--ink3);}
.rec-row{padding:8px 16px;border-bottom:1px solid var(--border);}
.rec-bar{display:flex;height:16px;border-radius:3px;overflow:hidden;margin-bottom:4px;}
.rec-seg{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:8px;color:#fff;}
.rec-summary{font-family:var(--mono);font-size:9px;color:var(--ink2);display:flex;justify-content:space-between;}
.ins-row{padding:8px 16px;border-bottom:1px solid var(--border);}
.ins-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;font-family:var(--mono);font-size:9px;}
.ins-name{color:var(--ink2);}
.ins-badge{padding:1px 6px;border-radius:3px;font-size:9px;}
.ins-badge.buy{background:var(--green-bg);color:var(--green);}
.ins-badge.sell{background:var(--red-bg);color:var(--red);}
.card-footer{padding:8px 16px;display:flex;justify-content:space-between;align-items:center;}
.sig{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:500;}
.sig.strong-buy{background:var(--green-bg);color:var(--green);border:1px solid #b7e4c7;}
.sig.buy{background:#f0f7f3;color:#40916c;border:1px solid #d8f3dc;}
.sig.hold{background:var(--surface2);color:var(--ink2);border:1px solid var(--border);}
.sig.watch{background:var(--gold-bg);color:var(--gold);border:1px solid #ffe08a;}
.sig.avoid{background:var(--red-bg);color:var(--red);border:1px solid #fbc4ab;}
.copy-btn{background:transparent;border:none;color:var(--ink3);font-family:var(--mono);font-size:9px;cursor:pointer;padding:4px;}
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.empty{text-align:center;padding:40px 20px;color:var(--ink3);font-family:var(--mono);font-size:12px;grid-column:1/-1;line-height:2;}
.debug{font-family:monospace;font-size:10px;background:#111;color:#9f9;padding:8px 16px;max-height:80px;overflow-y:auto;border-bottom:1px solid #333;display:none;}
@media(max-width:600px){.grid{grid-template-columns:1fr;padding:10px;}.summary-bar{gap:12px;}header{padding:12px;}}
</style>
</head>
<body>
<header>
  <div><div class="logo-main">VALUE SCREENER</div><div class="logo-sub">Powered by Finnhub · 🦁 Berkshire Holdings Highlighted</div></div>
  <div style="display:flex;align-items:center;gap:8px;">

</div>

<script>
const FH_KEY = 'd9o0ou1r01qqbd5segpgd9o0ou1r01qqbd5segq0';
const FH = 'https://finnhub.io/api/v1';
const BRK_SET = new Set(['AAPL','BAC','KO','CVX','JPM']);

const STOCKS = [
  {t:'AAPL', n:'Apple',            s:'Tech'},
  {t:'MSFT', n:'Microsoft',        s:'Tech'},
  {t:'NVDA', n:'NVIDIA',           s:'Tech'},
  {t:'AMZN', n:'Amazon',           s:'Tech'},
  {t:'GOOGL',n:'Alphabet',         s:'Tech'},
  {t:'META', n:'Meta',             s:'Tech'},
  {t:'NFLX', n:'Netflix',          s:'Tech'},
  {t:'AVGO', n:'Broadcom',         s:'Tech'},
  {t:'JPM',  n:'JPMorgan',         s:'Finance'},
  {t:'BAC',  n:'Bank of America',  s:'Finance'},
  {t:'V',    n:'Visa',             s:'Finance'},
  {t:'GS',   n:'Goldman Sachs',    s:'Finance'},
  {t:'UNH',  n:'UnitedHealth',     s:'Healthcare'},
  {t:'JNJ',  n:'J&J',              s:'Healthcare'},
  {t:'ABBV', n:'AbbVie',           s:'Healthcare'},
  {t:'WMT',  n:'Walmart',          s:'Consumer'},
  {t:'COST', n:'Costco',           s:'Consumer'},
  {t:'KO',   n:'Coca-Cola',        s:'Consumer'},
  {t:'TSLA', n:'Tesla',            s:'Auto'},
  {t:'XOM',  n:'ExxonMobil',       s:'Energy'},
  {t:'CVX',  n:'Chevron',          s:'Energy'},
];

let allData=[], activeFilter='all';
const f2 =n=>(n!=null&&!isNaN(n))?Number(n).toFixed(2):'—';
const f1 =n=>(n!=null&&!isNaN(n))?Number(n).toFixed(1):'—';
const pct=n=>(n!=null&&!isNaN(n))?(n>=0?'+':'')+Number(n).toFixed(2)+'%':'—';
const B  =n=>{if(!n||isNaN(n))return'—';const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1)+'T':a>=1e3?(n/1e3).toFixed(1)+'B':n.toFixed(0)+'M';}; // finnhub marketCap already in millions
const now=()=>new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
const delay=ms=>new Promise(r=>setTimeout(r,ms));

function dbg(msg){
  document.getElementById('lastUpd').textContent=msg.slice(0,50);
  console.log(msg);
  const el=document.getElementById('debugLog');
  if(el){el.style.display='block';const l=document.createElement('div');l.textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' '+msg;el.appendChild(l);if(el.children.length>25)el.removeChild(el.firstChild);el.scrollTop=el.scrollHeight;}
}

async function fhFetch(path){
  const res=await fetch(`${FH}${path}${path.includes('?')?'&':'?'}token=${FH_KEY}`);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text=await res.text();
  if(!text) return null;
  return JSON.parse(text);
}

async function loadStock(t){
  let quote=null, metric=null, earnings=null, recommend=null, insiders=null;
  try{
    quote=await fhFetch(`/quote?symbol=${t}`);
    dbg(`${t} quote: ${quote?.c ? '✓ $'+quote.c : '✗ empty'}`);
  }catch(e){ dbg(`${t} quote ERROR: ${e.message}`); }

  try{
    const d=await fhFetch(`/stock/metric?symbol=${t}&metric=all`);
    metric=d?.metric||null;
    dbg(`${t} metrics: ${metric ? '✓' : '✗ empty'}`);
  }catch(e){ dbg(`${t} metrics ERROR: ${e.message}`); }

  try{
    earnings=await fhFetch(`/stock/earnings?symbol=${t}`);
    dbg(`${t} earnings: ${earnings?.length ? '✓ '+earnings.length+' qtrs' : '✗ empty'}`);
  }catch(e){ dbg(`${t} earnings ERROR: ${e.message}`); }

  try{
    recommend=await fhFetch(`/stock/recommendation?symbol=${t}`);
    dbg(`${t} recommend: ${recommend?.length ? '✓' : '✗ empty'}`);
  }catch(e){ dbg(`${t} recommend ERROR: ${e.message}`); }

  try{
    const d=await fhFetch(`/stock/insider-transactions?symbol=${t}`);
    insiders=d?.data||null;
    dbg(`${t} insiders: ${insiders?.length ? '✓ '+insiders.length+' txns' : '✗ empty'}`);
  }catch(e){ dbg(`${t} insiders ERROR: ${e.message}`); }

  return{quote,metric,earnings,recommend,insiders};
}

async function loadEarningsCalendar(){
  const today=new Date();
  const in90=new Date(); in90.setDate(in90.getDate()+90);
  const from=today.toISOString().split('T')[0];
  const to=in90.toISOString().split('T')[0];
  try{
    const d=await fhFetch(`/calendar/earnings?from=${from}&to=${to}`);
    const cal={};
    (d?.earningsCalendar||[]).forEach(e=>{
      if(!cal[e.symbol] || e.date < cal[e.symbol]) cal[e.symbol]=e.date;
    });
    return cal;
  }catch(e){ dbg(`Earnings calendar ERROR: ${e.message}`); return {}; }
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const target=new Date(dateStr);
  const now=new Date();
  return Math.ceil((target-now)/86400000);
}

// ── Value Score using real Finnhub fields ──────────────────────────────────────
function score(q,m){
  let s=50;
  q=q||{}; m=m||{};
  const pe=m.peTTM||m.peBasicExclExtraTTM;
  if(pe&&pe>0&&pe<300) s+=pe<15?18:pe<20?10:pe<25?4:pe<35?0:-8;

  const evE=m.evEbitdaTTM;
  if(evE&&evE>0) s+=evE<10?15:evE<15?8:evE<20?2:evE<30?-3:-8;

  const roe=m.roeTTM;
  if(roe!=null) s+=roe>25?12:roe>15?8:roe>10?4:roe>0?0:-6;

  const roic=m.roiTTM;
  if(roic!=null) s+=roic>15?10:roic>10?6:roic>5?2:roic>0?0:-5;

  const de=m['totalDebt/totalEquityAnnual'];
  if(de!=null) s+=de<0.5?8:de<1?4:de<2?0:de<3?-4:-8;

  const gpm=m.grossMarginTTM;
  if(gpm!=null) s+=gpm>60?14:gpm>40?8:gpm>25?2:gpm>15?-2:-8;

  const npm=m.netProfitMarginTTM;
  if(npm!=null) s+=npm>25?10:npm>15?6:npm>8?2:npm>0?-2:-8;

  if(m['52WeekHigh']&&m['52WeekLow']&&q.c){
    const pos=(q.c-m['52WeekLow'])/(m['52WeekHigh']-m['52WeekLow']||0.01);
    s+=pos<0.2?15:pos<0.35?8:pos>0.85?-10:pos>0.7?-4:0;
  }

  return Math.max(0,Math.min(100,Math.round(s)));
}

function signal(sc){
  if(sc>=72) return{s:'strong-buy',l:'★ STRONG BUY'};
  if(sc>=60) return{s:'buy',l:'▲ BUY'};
  if(sc<=32) return{s:'avoid',l:'✗ AVOID'};
  if(sc<=42) return{s:'watch',l:'⚠ WATCH'};
  return{s:'hold',l:'HOLD'};
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderCard(d){
  const{stock:st,quote:q,metric:m,earnings,recommend,insiders,sig,earnDate}=d;
  const qq=q||{}, mm=m||{};
  const isBrk=BRK_SET.has(st.t);
  const sc=score(qq,mm);
  const{s,l}=sig||signal(sc);
  const scC=sc>=65?'#2d6a4f':sc>=50?'#b5890a':'#c1440e';

  const pe=mm.peTTM;
  const evE=mm.evEbitdaTTM;
  const pb=mm.pb;
  const roe=mm.roeTTM;
  const roic=mm.roiTTM;
  const de=mm['totalDebt/totalEquityAnnual'];
  const gpm=mm.grossMarginTTM;
  const npm=mm.netProfitMarginTTM;
  const opm=mm.operatingMarginTTM;
  const divY=mm.dividendYieldIndicatedAnnual||mm.currentDividendYieldTTM||0;
  const payR=mm.payoutRatioTTM;
  const high52=mm['52WeekHigh'];
  const low52=mm['52WeekLow'];
  const mktCap=mm.marketCapitalization;

  const chg=qq.d, chgP=qq.dp, price=qq.c;
  const pos52=high52&&low52&&price?Math.round((price-low52)/(high52-low52)*100):null;
  const pos52C=pos52!=null?(pos52<25?'g':pos52>75?'r':'n'):'n';

  // Earnings surprise dots
  const surps=(earnings||[]).slice(0,4);
  const beats=surps.filter(e=>e.actual>e.estimate).length;
  let dotsHtml='<div style="font-family:var(--mono);font-size:9px;color:var(--ink3)">No earnings history</div>';
  if(surps.length){
    dotsHtml=`<span style="font-family:var(--mono);font-size:8px;color:var(--ink3);margin-right:4px">LAST ${surps.length}Q:</span>`+
      surps.map(e=>{const b=e.actual>e.estimate;return `<span class="dot ${b?'beat':'miss'}">${b?'✓':'✗'}</span>`;}).join('')+
      `<span style="font-family:var(--mono);font-size:9px;color:var(--ink3);margin-left:4px">${beats}/${surps.length} beats</span>`;
  }

  // Earnings date
  const daysOut=daysUntil(earnDate);
  let earnHtml='<div style="font-family:var(--mono);font-size:9px;color:var(--ink3)">No upcoming date found</div>';
  if(earnDate&&daysOut!=null){
    earnHtml=`<div class="earn-info">Reports ${earnDate}</div><span class="earn-badge ${daysOut<=7?'soon':''}">${daysOut<=0?'today/passed':daysOut+'d away'}</span>`;
  }

  return `<div class="card${isBrk?' brk':''}" data-s="${s}" data-sc="${sc}" data-brk="${isBrk}" data-div="${divY>0?'1':'0'}" data-chg="${chgP||0}" data-earndays="${daysOut!=null?daysOut:999}">
  <div class="card-hdr">
    <div><div><span class="ticker">${st.t}</span><span class="s-tag">${st.s}</span>${isBrk?'<span class="brk-badge">🦁 BRK</span>':''}</div><div class="cname">${st.n}</div></div>
    <div class="price-blk"><div class="cprice">${price?'$'+f2(price):'—'}</div><div class="cchg ${(chg||0)>=0?'up':'dn'}">${chg!=null?((chg>=0?'+':'')+f2(chg)+' ('+pct(chgP)+')'):'—'}</div></div>
  </div>
  <div class="sec-t">PRICE CONTEXT</div>
  <div class="fg">
    <div class="fi"><div class="fl">52W Low</div><div class="fv n">${low52?'$'+f2(low52):'—'}</div></div>
    <div class="fi"><div class="fl">52W High</div><div class="fv n">${high52?'$'+f2(high52):'—'}</div></div>
    <div class="fi"><div class="fl">52W Position</div><div class="fv ${pos52C}">${pos52!=null?pos52+'% of range':'—'}</div></div>
    <div class="fi"><div class="fl">Market Cap</div><div class="fv n">${B(mktCap)}</div></div>
  </div>
  <div class="sec-t">VALUATION (TTM)</div>
  <div class="fg">
    <div class="fi"><div class="fl">P/E Ratio</div><div class="fv ${pe?(pe<20?'g':pe<30?'n':'r'):'n'}">${pe?f1(pe):'—'}</div></div>
    <div class="fi"><div class="fl">EV/EBITDA</div><div class="fv ${evE?(evE<15?'g':evE<25?'n':'r'):'n'}">${evE?f1(evE):'—'}</div></div>
    <div class="fi"><div class="fl">Price/Book</div><div class="fv ${pb?(pb<2?'g':pb<4?'n':'r'):'n'}">${pb?f2(pb):'—'}</div></div>
    <div class="fi"><div class="fl">Debt/Equity</div><div class="fv ${de!=null?(de<1?'g':de<2?'n':'r'):'n'}">${de!=null?f2(de):'—'}</div></div>
    <div class="fi"><div class="fl">ROE</div><div class="fv ${roe>15?'g':roe>8?'n':roe>0?'r':'n'}">${roe!=null?f1(roe)+'%':'—'}</div></div>
    <div class="fi"><div class="fl">ROIC</div><div class="fv ${roic>12?'g':roic>6?'n':roic>0?'r':'n'}">${roic!=null?f1(roic)+'%':'—'}</div></div>
  </div>
  <div class="sec-t">PROFITABILITY & MOAT</div>
  <div class="fg">
    <div class="fi"><div class="fl">Gross Margin</div><div class="fv ${gpm>50?'g':gpm>30?'n':'r'}">${gpm!=null?f1(gpm)+'%':'—'}</div></div>
    <div class="fi"><div class="fl">Net Margin</div><div class="fv ${npm>15?'g':npm>8?'n':'r'}">${npm!=null?f1(npm)+'%':'—'}</div></div>
    <div class="fi"><div class="fl">Operating Margin</div><div class="fv ${opm>20?'g':opm>10?'n':'r'}">${opm!=null?f1(opm)+'%':'—'}</div></div>
  </div>
  <div class="score-wrap">
    <div class="score-hdr"><span class="score-lbl">Buffett Value Score</span><span class="score-num" style="color:${scC}">${sc}/100</span></div>
    <div class="bar-bg"><div class="bar-fill" style="width:${sc}%;background:${scC}"></div></div>
  </div>
  <div class="sec-t">📅 NEXT EARNINGS DATE</div>
  <div class="earn-row">${earnHtml}</div>
  <div class="sec-t">EARNINGS SURPRISE HISTORY</div>
  <div class="dot-row">${dotsHtml}</div>
  <div class="sec-t">📊 ANALYST RECOMMENDATIONS</div>
  <div class="rec-row">${(function(){
    const rec=Array.isArray(recommend)&&recommend.length?recommend[0]:null;
    if(!rec) return '<div style="font-family:var(--mono);font-size:9px;color:var(--ink3)">No analyst data</div>';
    const total=rec.strongBuy+rec.buy+rec.hold+rec.sell+rec.strongSell;
    if(!total) return '<div style="font-family:var(--mono);font-size:9px;color:var(--ink3)">No analyst data</div>';
    const segs=[
      {n:rec.strongBuy,c:'#2d6a4f',l:'SB'},
      {n:rec.buy,c:'#52b788',l:'B'},
      {n:rec.hold,c:'#b5890a',l:'H'},
      {n:rec.sell,c:'#e07050',l:'S'},
      {n:rec.strongSell,c:'#c1440e',l:'SS'},
    ];
    const bars=segs.filter(s=>s.n>0).map(s=>`<div class="rec-seg" style="width:${(s.n/total*100)}%;background:${s.c}">${s.n}</div>`).join('');
    const bullish=rec.strongBuy+rec.buy, bearish=rec.sell+rec.strongSell;
    return `<div class="rec-bar">${bars}</div><div class="rec-summary"><span>${total} analysts · ${rec.period}</span><span style="color:${bullish>bearish?'var(--green)':bearish>bullish?'var(--red)':'var(--ink3)'}">${bullish} bullish / ${bearish} bearish</span></div>`;
  })()}</div>

  <div class="sec-t">👤 RECENT INSIDER ACTIVITY</div>
  <div class="ins-row">${(function(){
    const txns=(insiders||[]).filter(i=>i.transactionPrice>0).slice(0,3);
    if(!txns.length) return '<div style="font-family:var(--mono);font-size:9px;color:var(--ink3)">No recent open-market transactions</div>';
    return txns.map(i=>{
      const isBuy=i.change>0;
      const name=(i.name||'').split(' ').slice(0,2).join(' ');
      return `<div class="ins-item"><span class="ins-name">${name} · ${i.transactionDate}</span><span class="ins-badge ${isBuy?'buy':'sell'}">${isBuy?'BUY':'SELL'} ${Math.abs(i.change).toLocaleString()}</span></div>`;
    }).join('');
  })()}</div>

  <div class="sec-t">DIVIDEND</div>
  <div class="div-row">
    <div class="div-info">${divY>0?f2(divY)+'% yield':'No dividend'}${payR?' · '+f1(payR)+'% payout':''}</div>
    <span class="div-b ${divY>2.5?'a':divY>0?'d':'n'}">${divY>2.5?'★ HIGH YIELD':divY>0?'DIVIDEND':'NO DIV'}</span>
  </div>
  <div class="card-footer"><span class="sig ${s}">${l}</span><button class="copy-btn" onclick="copyTick('${st.t}',this)">copy ↗</button></div>
</div>`;
}

function copyTick(t,btn){navigator.clipboard?.writeText(t).then(()=>{btn.textContent='copied!';setTimeout(()=>btn.textContent='copy ↗',1500);}).catch(()=>alert(t));}

function renderCards(){
  const grid=document.getElementById('grid');
  let cards=[...allData];
  if(activeFilter==='brk') cards=cards.filter(d=>BRK_SET.has(d.stock.t));
  else if(activeFilter==='buy') cards=cards.filter(d=>['strong-buy','buy'].includes(d.sig?.s));
  else if(activeFilter==='value') cards.sort((a,b)=>score(b.quote,b.metric)-score(a.quote,a.metric));
  else if(activeFilter==='earnings') cards=cards.filter(d=>{const dy=daysUntil(d.earnDate);return dy!=null&&dy>=0&&dy<=14;}).sort((a,b)=>daysUntil(a.earnDate)-daysUntil(b.earnDate));
  else if(activeFilter==='moat') cards=cards.filter(d=>(d.metric?.grossMarginTTM||0)>40);
  else if(activeFilter==='dividend') cards=cards.filter(d=>(d.metric?.dividendYieldIndicatedAnnual||0)>0);
  else if(activeFilter==='momentum') cards=cards.filter(d=>(d.quote?.dp||0)>0).sort((a,b)=>(b.quote?.dp||0)-(a.quote?.dp||0));

  if(!cards.length&&allData.some(d=>d.quote)){grid.innerHTML='<div class="empty">No stocks match this filter.</div>';return;}
  if(!allData.some(d=>d.quote)){grid.innerHTML='<div class="empty">Tap ↻ REFRESH to load data</div>';return;}
  grid.innerHTML=cards.map(d=>d.metric?renderCard(d):`
    <div class="card${BRK_SET.has(d.stock.t)?' brk':''}" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div><div><span class="ticker">${d.stock.t}</span><span class="s-tag">${d.stock.s}</span>${BRK_SET.has(d.stock.t)?'<span class="brk-badge">🦁 BRK</span>':''}</div><div class="cname">${d.stock.n}</div></div>
        <div class="price-blk"><div class="cprice">${d.quote?.c?'$'+f2(d.quote.c):'Loading...'}</div><div class="cchg ${(d.quote?.d||0)>=0?'up':'dn'}">${d.quote?.d!=null?((d.quote.d>=0?'+':'')+f2(d.quote.d)+' ('+pct(d.quote.dp)+')'):'—'}</div></div>
      </div>
      <div class="skeleton" style="height:6px;margin-bottom:5px"></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--ink3);margin-top:4px">⏳ Loading fundamentals...</div>
    </div>`).join('');
}

function setFilter(f,btn){activeFilter=f;document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCards();}

function updateSummary(){
  let buys=0,watches=0,earnSoon=0,divs=0;
  allData.filter(d=>d.metric).forEach(d=>{
    const s=d.sig?.s;
    if(s==='strong-buy'||s==='buy') buys++;
    if(s==='watch') watches++;
    const dy=daysUntil(d.earnDate);
    if(dy!=null&&dy>=0&&dy<=14) earnSoon++;
    if((d.metric?.dividendYieldIndicatedAnnual||0)>0) divs++;
  });
  document.getElementById('sBuy').textContent=buys;
  document.getElementById('sWatch').textContent=watches;
  document.getElementById('sEarnSoon').textContent=earnSoon;
  document.getElementById('sDivs').textContent=divs;
}

async function loadAll(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spin');
  allData=[];
  STOCKS.forEach(s=>allData.push({stock:s,quote:null,metric:null,earnings:null,recommend:null,insiders:null,earnDate:null,sig:null}));
  renderCards();

  // Load earnings calendar once for all stocks
  dbg('Loading earnings calendar...');
  const calendar=await loadEarningsCalendar();

  // Finnhub free tier: 60 calls/min. 3 calls/stock × 21 = 63 calls.
  // Small gap keeps us safely under limit even with calendar call included.
  for(let i=0;i<STOCKS.length;i++){
    const s=STOCKS[i];
    dbg(`Loading ${s.t} (${i+1}/${STOCKS.length})...`);
    try{
      const r=await loadStock(s.t);
      const idx=allData.findIndex(d=>d.stock.t===s.t);
      if(idx>=0){
        allData[idx].quote=r.quote;
        allData[idx].metric=r.metric;
        allData[idx].earnings=r.earnings;
        allData[idx].recommend=r.recommend;
        allData[idx].insiders=r.insiders;
        allData[idx].earnDate=calendar[s.t]||null;
        const sc=score(r.quote,r.metric);
        allData[idx].sig=signal(sc);
        renderCards();
        updateSummary();
      }
    }catch(e){ dbg(`${s.t}: ${e.message}`); }
    await delay(350); // ~2.8 calls/sec = well under 60/min limit
  }

  updateSummary();
  document.getElementById('lastUpd').textContent='Updated '+now();
  btn.classList.remove('spin');
}
</script>
</body>
</html>
