body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;}

.s-lbl{font-family:var(--mono);font-size:8px;color:rgba(255,255,255,0.35);letter-spacing:1px;text-transform:uppercase;}

.tabs{background:var(--surface);border-bottom:2px solid var(--border);display:flex;}
.tab-btn{flex:1;padding:10px;background:transparent;color:var(--ink2);border:none;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:1px;border-bottom:2px solid transparent;margin-bottom:-2px;}

.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.f-lbl{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:1px;margin-right:2px;}
.f-btn{background:transparent;border:1px solid var(--border);color:var(--ink2);padding:5px 12px;border-radius:20px;cursor:pointer;font-family:var(--sans);font-size:12px;transition:all 0.15s;}

.f-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.f-btn.brk-f{border-color:var(--brk);color:var(--brk);}
.f-btn.brk-f.active{background:var(--brk);border-color:var(--brk);color:#fff;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:box-shadow 0.2s;}

.card-hdr{padding:12px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border);}
.ticker{font-family:var(--mono);font-size:18px;color:var(--ink);font-weight:500;}
.s-tag{font-family:var(--mono);font-size:8px;color:var(--ink3);background:var(--surface2);padding:2px 6px;border-radius:3px;text-transform:uppercase;margin-left:5px;vertical-align:middle;}

.fi{display:flex;flex-direction:column;gap:1px;}
.fl{font-family:var(--mono);font-size:8px;color:var(--ink3);text-transform:uppercase;}
.fv{font-family:var(--mono);font-size:12px;}

.score-num{font-family:var(--mono);font-size:11px;font-weight:500;}
.bar-bg{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;}

.ins-badge{padding:1px 6px;border-radius:3px;font-size:9px;}

.ins-badge.sell{background:var(--red-bg);color:var(--red);}

.sig{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:500;}
.sig.strong-buy{background:var(--green-bg);color:var(--green);border:1px solid #b7e4c7;}
.sig.buy{background:#f0f7f3;color:#40916c;border:1px solid #d8f3dc;}
.sig.hold{background:var(--surface2);color:var(--ink2);border:1px solid var(--border);}
.sig.watch{background:var(--gold-bg);color:var(--gold);border:1px solid #ffe08a;}
.sig.avoid{background:var(--red-bg);color:var(--red);border:1px solid #fbc4ab;}
.copy-btn{background:transparent;border:none;color:var(--ink3);font-family:var(--mono);font-size:9px;cursor:pointer;padding:4px;}
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;}

.rank-list{padding:0 20px 16px;}

.rank-sig{font-family:var(--mono);font-size:9px;text-align:right;padding:2px 8px;border-radius:10px;}
.rank-header{display:grid;grid-template-columns:32px 1fr 70px 60px 60px 60px 90px;gap:8px;padding:6px 12px;font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:0.5px;text-transform:uppercase;}
.expand-panel{margin:0 20px 16px;}
.track-row{display:grid;grid-template-columns:1fr 90px 90px 90px 90px;gap:8px;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:6px;}
.track-header{display:grid;grid-template-columns:1fr 90px 90px 90px 90px;gap:8px;padding:6px 12px;font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:0.5px;text-transform:uppercase;}
.snapshot-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px;}
.snapshot-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
@media(max-width:600px){.grid{grid-template-columns:1fr;padding:10px;}.summary-bar{gap:12px;}header{padding:12px;}}

async function fhFetch(path){
  const res=await fetch(`${FH}${path}${path.includes('?')?'&':'?'}token=${FH_KEY}`);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text=await res.text();
  if(!text) return null;
  return JSON.parse(text);
}

async function loadStock(t){

    quote=await fhFetch(`/quote?symbol=${t}`);

  }catch(e){ dbg(`${t} quote ERROR: ${e.message}`); }

    const d=await fhFetch(`/stock/metric?symbol=${t}&metric=all`);

    dbg(`${t} metrics: ${metric ? '✓' : '✗ empty'}`);

    dbg(`${t} earnings: ${earnings?.length ? '✓ '+earnings.length+' qtrs' : '✗ empty'}`);
  }catch(e){ dbg(`${t} earnings ERROR: ${e.message}`); }

  try{
    recommend=await fhFetch(`/stock/recommendation?symbol=${t}`);
    dbg(`${t} recommend: ${recommend?.length ? '✓' : '✗ empty'}`);
  }catch(e){ dbg(`${t} recommend ERROR: ${e.message}`); }

  try{

  }catch(e){ dbg(`${t} insiders ERROR: ${e.message}`); }

  return{quote,metric,earnings,recommend,insiders};
}

async function loadEarningsCalendar(){
  const today=new Date();
  const in90=new Date(); in90.setDate(in90.getDate()+90);
  const from=today.toISOString().split('T')[0];
  const to=in90.toISOString().split('T')[0];
  try{
    const d=await fhFetch(`/calendar/earnings?from=${from}&to=${to}`);
    const cal={};
    (d?.earningsCalendar||[]).forEach(e=>{
      if(!cal[e.symbol] || e.date < cal[e.symbol]) cal[e.symbol]=e.date;
    });
    return cal;
  }catch(e){ dbg(`Earnings calendar ERROR: ${e.message}`); return {}; }
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const target=new Date(dateStr);
  const now=new Date();
  return Math.ceil((target-now)/86400000);
}

// ── Value Score using real Finnhub fields ──────────────────────────────────────
function score(q,m){
  q=q||{}; m=m||{};
  // Guard: if we don't have a real price OR no meaningful metrics, this isn't valid data
  const hasPrice = q.c!=null && q.c>0;
  const hasAnyMetric = m.peTTM!=null || m.evEbitdaTTM!=null || m.roeTTM!=null || m.grossMarginTTM!=null;
  if(!hasPrice || !hasAnyMetric) return null;

  let s=50;
  const pe=m.peTTM||m.peBasicExclExtraTTM;
  if(pe&&pe>0&&pe<300) s+=pe<15?18:pe<20?10:pe<25?4:pe<35?0:-8;

  const evE=m.evEbitdaTTM;
  if(evE&&evE>0) s+=evE<10?15:evE<15?8:evE<20?2:evE<30?-3:-8;

  const roe=m.roeTTM;
  if(roe!=null) s+=roe>25?12:roe>15?8:roe>10?4:roe>0?0:-6;

  const roic=m.roiTTM;
  if(roic!=null) s+=roic>15?10:roic>10?6:roic>5?2:roic>0?0:-5;

  const de=m['totalDebt/totalEquityAnnual'];
  if(de!=null) s+=de<0.5?8:de<1?4:de<2?0:de<3?-4:-8;

  const gpm=m.grossMarginTTM;
  if(gpm!=null) s+=gpm>60?14:gpm>40?8:gpm>25?2:gpm>15?-2:-8;

  const npm=m.netProfitMarginTTM;
  if(npm!=null) s+=npm>25?10:npm>15?6:npm>8?2:npm>0?-2:-8;

  if(m['52WeekHigh']&&m['52WeekLow']&&q.c){
    const pos=(q.c-m['52WeekLow'])/(m['52WeekHigh']-m['52WeekLow']||0.01);
    s+=pos<0.2?15:pos<0.35?8:pos>0.85?-10:pos>0.7?-4:0;
  }

  return Math.round(s); // uncapped raw score — capping happens at display time
}

// Convert raw scores to percentile rank (0-100) relative to a batch of stocks
// This guarantees differentiation — the best stock in the batch gets 100,
// the worst gets 0, everything else spreads proportionally between.
function percentileScores(items, rawScoreKey='score'){
  const valid = items.filter(d=>d[rawScoreKey]!=null);
  if(valid.length<2) return items.map(d=>({...d, pctScore:d[rawScoreKey]}));
  const sorted = [...valid].sort((a,b)=>a[rawScoreKey]-b[rawScoreKey]);
  const rankMap = new Map();
  sorted.forEach((d,i)=>{ rankMap.set(d.ticker, Math.round(i/(sorted.length-1)*100)); });
  return items.map(d=>({...d, pctScore: d[rawScoreKey]!=null ? rankMap.get(d.ticker) : null}));
}

// Generic percentile ranker for any raw metric — direction-aware (higher or lower is "better")
function percentileRank(items, key, higherIsBetter=true){
  const valid = items.filter(d=>d[key]!=null && !isNaN(d[key]));
  const outKey = 'pct_'+key;
  if(valid.length<2) return items.map(d=>({...d, [outKey]: d[key]!=null?50:null}));
  const sorted = [...valid].sort((a,b)=> higherIsBetter ? a[key]-b[key] : b[key]-a[key]);
  const rankMap = new Map();
  sorted.forEach((d,i)=>{ rankMap.set(d.ticker, Math.round(i/(sorted.length-1)*100)); });
  return items.map(d=>({...d, [outKey]: d[key]!=null ? rankMap.get(d.ticker) : null}));
}

// ── Magic Formula (Greenblatt): Earnings Yield + Return on Capital ────────────
// Earnings Yield ≈ Operating Margin / EV-to-Revenue (cheap + profitable)
// Return on Capital ≈ our ROIC proxy (roiTTM)
function magicFormulaRaw(m){
  m=m||{};
  const opm = m.operatingMarginTTM;
  const evRev = m.evRevenueTTM;
  const ey = (opm!=null && evRev>0) ? opm/evRev : null;
  const roc = m.roiTTM!=null ? m.roiTTM : null;
  return { ey, roc };
}

// ── Piotroski F-Score (approximated, 0-9) ──────────────────────────────────────
// Uses TTM vs Annual trend comparisons as a proxy for the traditional YoY checks
function piotroskiScore(m){
  m=m||{};
  let pts=0, checks=0;
  const has=(v)=>v!=null && !isNaN(v);

  if(has(m.roaTTM)){ checks++; if(m.roaTTM>0) pts++; }
  if(has(m.cashFlowPerShareTTM)){ checks++; if(m.cashFlowPerShareTTM>0) pts++; }
  if(has(m.roaTTM)&&has(m.roaAnnual)){ checks++; if(m.roaTTM>m.roaAnnual) pts++; }
  if(has(m.cashFlowPerShareTTM)&&has(m.epsTTM)){ checks++; if(m.cashFlowPerShareTTM>m.epsTTM) pts++; }
  if(has(m['longTermDebt/equityQuarterly'])&&has(m['longTermDebt/equityAnnual'])){ checks++; if(m['longTermDebt/equityQuarterly']<m['longTermDebt/equityAnnual']) pts++; }
  if(has(m.currentRatioQuarterly)&&has(m.currentRatioAnnual)){ checks++; if(m.currentRatioQuarterly>m.currentRatioAnnual) pts++; }
  if(has(m.bookValueShareGrowth5Y)){ checks++; if(m.bookValueShareGrowth5Y>0) pts++; }
  if(has(m.grossMarginTTM)&&has(m.grossMarginAnnual)){ checks++; if(m.grossMarginTTM>m.grossMarginAnnual) pts++; }
  if(has(m.assetTurnoverTTM)&&has(m.assetTurnoverAnnual)){ checks++; if(m.assetTurnoverTTM>m.assetTurnoverAnnual) pts++; }

  // Scale to a 0-9 equivalent even if some checks were unavailable
  return checks>0 ? Math.round((pts/checks)*9*10)/10 : null;
}

// ── GARP: Growth at a Reasonable Price ─────────────────────────────────────────
// Lower PEG = cheaper relative to growth. Negative/zero PEG (shrinking earnings) excluded.
function garpRaw(m){
  m=m||{};
  const peg = m.pegTTM;
  return (peg!=null && peg>0) ? peg : null;
}

// ── Quality + Momentum ──────────────────────────────────────────────────────────
function qualityMomentumRaw(m){
  m=m||{};
  const qualityParts = [m.roeTTM, m.roiTTM, m.grossMarginTTM, m.netProfitMarginTTM].filter(v=>v!=null);
  const quality = qualityParts.length ? qualityParts.reduce((a,b)=>a+b,0)/qualityParts.length : null;
  const momParts = [m['13WeekPriceReturnDaily'], m['26WeekPriceReturnDaily']].filter(v=>v!=null);
  const momentum = momParts.length ? momParts.reduce((a,b)=>a+b,0)/momParts.length : null;
  return { quality, momentum };
}

// ── Composite: blend all 5 methodologies via percentile averaging ─────────────
function computeCompositeScores(items){
  let d = items.map(x=>({...x}));

  // Attach raw sub-metrics
  d = d.map(x=>{
    const mf = magicFormulaRaw(x.metric);
    const qm = qualityMomentumRaw(x.metric);
    return {
      ...x,
      mf_ey: mf.ey, mf_roc: mf.roc,
      fscore: x.metric ? piotroskiScore(x.metric) : null,
      garp_peg: garpRaw(x.metric),
      qm_quality: qm.quality, qm_momentum: qm.momentum,
    };
  });

  // Percentile-rank each raw component within this batch
  d = percentileScores(d, 'score');                      // Buffett -> pctScore
  d = percentileRank(d, 'mf_ey', true);                   // higher earnings yield = better
  d = percentileRank(d, 'mf_roc', true);                  // higher ROC = better
  d = percentileRank(d, 'fscore', true);                  // higher F-Score = better
  d = percentileRank(d, 'garp_peg', false);                // LOWER peg = better
  d = percentileRank(d, 'qm_quality', true);
  d = percentileRank(d, 'qm_momentum', true);

  // Combine sub-percentiles into each methodology's overall percentile
  d = d.map(x=>{
    const buffettPct = x.pctScore;
    const magicPct = (x.pct_mf_ey!=null && x.pct_mf_roc!=null) ? Math.round((x.pct_mf_ey+x.pct_mf_roc)/2) : null;
    const fscorePct = x.pct_fscore;
    const garpPct = x.pct_garp_peg;
    const qmPct = (x.pct_qm_quality!=null && x.pct_qm_momentum!=null) ? Math.round((x.pct_qm_quality+x.pct_qm_momentum)/2) : null;

    const parts = [buffettPct, magicPct, fscorePct, garpPct, qmPct].filter(v=>v!=null);
    const composite = parts.length ? Math.round(parts.reduce((a,b)=>a+b,0)/parts.length) : null;

    return { ...x, buffettPct, magicPct, fscorePct, garpPct, qmPct, composite };
  });

  return d;
}

function signal(sc){
  if(sc==null) return{s:'hold',l:'NO DATA'};
  if(sc>=72) return{s:'strong-buy',l:'★ STRONG BUY'};
  if(sc>=60) return{s:'buy',l:'▲ BUY'};
  if(sc<=32) return{s:'avoid',l:'✗ AVOID'};
  if(sc<=42) return{s:'watch',l:'⚠ WATCH'};
  return{s:'hold',l:'HOLD'};
}

function copyTick(t,btn){navigator.clipboard?.writeText(t).then(()=>{btn.textContent='copied!';setTimeout(()=>btn.textContent='copy ↗',1500);}).catch(()=>alert(t));}

function renderCards(){
  const grid=document.getElementById('grid');
  let cards=[...allData];
  if(activeFilter==='brk') cards=cards.filter(d=>BRK_SET.has(d.stock.t));
  else if(activeFilter==='buy') cards=cards.filter(d=>['strong-buy','buy'].includes(d.sig?.s));
  else if(activeFilter==='value') cards.sort((a,b)=>score(b.quote,b.metric)-score(a.quote,a.metric));
  else if(activeFilter==='earnings') cards=cards.filter(d=>{const dy=daysUntil(d.earnDate);return dy!=null&&dy>=0&&dy<=14;}).sort((a,b)=>daysUntil(a.earnDate)-daysUntil(b.earnDate));
  else if(activeFilter==='moat') cards=cards.filter(d=>(d.metric?.grossMarginTTM||0)>40);
  else if(activeFilter==='dividend') cards=cards.filter(d=>(d.metric?.dividendYieldIndicatedAnnual||0)>0);
  else if(activeFilter==='momentum') cards=cards.filter(d=>(d.quote?.dp||0)>0).sort((a,b)=>(b.quote?.dp||0)-(a.quote?.dp||0));

  if(!cards.length&&allData.some(d=>d.quote)){grid.innerHTML='<div class="empty">No stocks match this filter.</div>';return;}
  if(!allData.some(d=>d.quote)){grid.innerHTML='<div class="empty">Tap ↻ REFRESH to load data</div>';return;}
  grid.innerHTML=cards.map(d=>d.metric?renderCard(d):`
    <div class="card${BRK_SET.has(d.stock.t)?' brk':''}" style="padding:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div><div><span class="ticker">${d.stock.t}</span><span class="s-tag">${d.stock.s}</span>${BRK_SET.has(d.stock.t)?'<span class="brk-badge">🦁 BRK</span>':''}</div><div class="cname">${d.stock.n}</div></div>
        <div class="price-blk"><div class="cprice">${d.quote?.c?'$'+f2(d.quote.c):'Loading...'}</div><div class="cchg ${(d.quote?.d||0)>=0?'up':'dn'}">${d.quote?.d!=null?((d.quote.d>=0?'+':'')+f2(d.quote.d)+' ('+pct(d.quote.dp)+')'):'—'}</div></div>
      </div>
      <div class="skeleton" style="height:6px;margin-bottom:5px"></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--ink3);margin-top:4px">⏳ Loading fundamentals...</div>
    </div>`).join('');
}

function setFilter(f,btn){activeFilter=f;document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderCards();}

function updateSummary(){
  let buys=0,watches=0,earnSoon=0,divs=0;
  allData.filter(d=>d.metric).forEach(d=>{
    const s=d.sig?.s;
    if(s==='strong-buy'||s==='buy') buys++;
    if(s==='watch') watches++;
    const dy=daysUntil(d.earnDate);
    if(dy!=null&&dy>=0&&dy<=14) earnSoon++;
    if((d.metric?.dividendYieldIndicatedAnnual||0)>0) divs++;
  });
  document.getElementById('sBuy').textContent=buys;
  document.getElementById('sWatch').textContent=watches;
  document.getElementById('sEarnSoon').textContent=earnSoon;
  document.getElementById('sDivs').textContent=divs;
}

  document.getElementById('modeBacktest').classList.toggle('active', mode==='backtest');

async function runScan(){
  const btn=document.getElementById('scanBtn');
  if(btn){ btn.disabled=true; btn.textContent='⏳ SCANNING...'; }
  scanData = TOP_100.map(t=>({ticker:t, name:NAME_MAP[t]||t, quote:null, metric:null, score:null, scanned:false}));
  renderScanView();

  const progEl=document.getElementById('scanProgress');
  const barEl=document.getElementById('scanBarFill');

  for(let i=0;i<TOP_100.length;i++){
    const t=TOP_100[i];
    if(progEl) progEl.textContent=`Scanning ${t} (${i+1}/${TOP_100.length})...`;
    if(barEl) barEl.style.width=`${((i+1)/TOP_100.length*100)}%`;
    try{
      const r=await quickScanStock(t);
      scanData[i].quote=r.quote;
      scanData[i].metric=r.metric;
      scanData[i].score=score(r.quote,r.metric); // null if data incomplete
      scanData[i].scanned=true;
    }catch(e){ dbg(`Scan ${t} error: ${e.message}`); }
    if(i%10===0) renderScanView(); // update every 10 for perf
    await delay(700); // 2 calls per stock, ~85 calls/min-ish safe margin under 60/min for pairs
  }
  renderScanView();
  if(progEl) progEl.textContent=`Scan complete · ${TOP_100.length} stocks · Updated ${now()}`;
  if(btn){ btn.disabled=false; btn.textContent='↻ RE-SCAN'; }
}

// ── Multi-Strategy Backtest (Yahoo Finance historical prices) ──────────────────
// IMPORTANT SCOPE: tests 4 price-based factors only — Momentum, RSI Mean Reversion,
// 52-Week High Proximity, and Low Volatility. Does NOT test fundamentals (P/E, ROE,
// etc.) since no free source provides historical fundamentals. All 4 strategies use
// the SAME rebalance dates and forward-return window so results are directly comparable.

const YAHOO_SYMBOL_MAP = { 'BRK.B':'BRK-B' };
let backtestData = null; // cached results so re-render doesn't re-fetch

async function fetchYahooHistory(ticker){
  const ySym = YAHOO_SYMBOL_MAP[ticker] || ticker;
  const url = `${WORKER}/?symbol=${ySym}&range=2y&interval=1d`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  if(!text) return null;
  const d = JSON.parse(text);
  const result = d?.chart?.result?.[0];
  if(!result) { dbg(`${ticker} Yahoo: ${d?.chart?.error?.description || 'no result'}`); return null; }
  const timestamps = result.timestamp || [];
  const closes = result.indicators?.adjclose?.[0]?.adjclose || result.indicators?.quote?.[0]?.close || [];
  if(!timestamps.length || !closes.length) return null;
  const clean = timestamps.map((t,i)=>({t, c:closes[i]})).filter(x=>x.c!=null);
  return clean;
}

// ── Factor score functions — each returns a number where HIGHER = "top quintile" ─
function scoreMomentum(series, idx){
  if(idx-130<0) return null;
  const cNow=series[idx].c, c13w=series[idx-65].c, c26w=series[idx-130].c;
  if(!c13w||!c26w) return null;
  return (((cNow-c13w)/c13w)+((cNow-c26w)/c26w))/2*100;
}

function scoreRSIReversal(series, idx, period=14){
  // Low RSI (oversold) = mean-reversion "buy" candidate = should score HIGH
  if(idx-period<0) return null;
  let gains=0, losses=0;
  for(let i=idx-period+1;i<=idx;i++){
    const chg=series[i].c-series[i-1].c;
    if(chg>0) gains+=chg; else losses+=-chg;
  }
  const avgGain=gains/period, avgLoss=losses/period;
  const rsi = avgLoss===0 ? 100 : 100-(100/(1+avgGain/avgLoss));
  return 100-rsi; // invert: low RSI -> high score
}

function scoreHighProximity(series, idx, lookback=252){
  const start=Math.max(0, idx-lookback+1);
  let maxC=-Infinity;
  for(let i=start;i<=idx;i++){ if(series[i].c>maxC) maxC=series[i].c; }
  if(maxC<=0) return null;
  return (series[idx].c/maxC)*100; // closer to 52w high = higher score
}

function scoreLowVolatility(series, idx, lookback=60){
  if(idx-lookback<0) return null;
  const rets=[];
  for(let i=idx-lookback+1;i<=idx;i++){
    rets.push((series[i].c-series[i-1].c)/series[i-1].c);
  }
  const mean=rets.reduce((a,b)=>a+b,0)/rets.length;
  const variance=rets.reduce((a,b)=>a+Math.pow(b-mean,2),0)/rets.length;
  const vol=Math.sqrt(variance);
  return -vol; // invert: low volatility -> high score
}

const STRATEGIES = [
  { key:'momentum', label:'📈 Momentum', desc:'13wk+26wk trailing returns — trend-following', scoreFn:scoreMomentum },
  { key:'rsi',       label:'🔄 RSI Mean Reversion', desc:'Buying oversold stocks (low RSI)', scoreFn:scoreRSIReversal },
  { key:'highprox',  label:'🎯 52W High Proximity', desc:'Stocks trading near their 52-week high', scoreFn:scoreHighProximity },
  { key:'lowvol',    label:'🛡️ Low Volatility', desc:'Lower price swings vs higher price swings', scoreFn:scoreLowVolatility },
];

function computeFactorBacktest(histories, scoreFn){
  const tickers = Object.keys(histories);
  if(tickers.length<10) return null;
  const minLen = Math.min(...tickers.map(t=>histories[t].length));
  const aligned = {};
  tickers.forEach(t=>{ aligned[t]=histories[t].slice(-minLen); });

  const FORWARD=21, STEP=21;
  const startIdx=252; // common lookback so all 4 strategies use identical rebalance dates
  const endIdx=minLen-FORWARD;
  if(endIdx<=startIdx) return null;

  let periodResults=[];
  for(let idx=startIdx; idx<endIdx; idx+=STEP){
    const scored = tickers.map(t=>{
      const series=aligned[t];
      const s=scoreFn(series, idx);
      if(s==null||isNaN(s)) return null;
      const cNow=series[idx].c, cFwd=series[idx+FORWARD].c;
      const fwdReturn=((cFwd-cNow)/cNow)*100;
      return { t, s, fwdReturn };
    }).filter(x=>x!=null);

    if(scored.length<10) continue;
    scored.sort((a,b)=>b.s-a.s);
    const qSize=Math.max(1, Math.floor(scored.length*0.2));
    const topQ=scored.slice(0,qSize), bottomQ=scored.slice(-qSize);
    const topAvg=topQ.reduce((s,x)=>s+x.fwdReturn,0)/topQ.length;
    const bottomAvg=bottomQ.reduce((s,x)=>s+x.fwdReturn,0)/bottomQ.length;
    periodResults.push({ idx, topAvg, bottomAvg, qSize, beat:topAvg>bottomAvg });
  }

  if(!periodResults.length) return null;
  const topAvgReturn=periodResults.reduce((s,p)=>s+p.topAvg,0)/periodResults.length;
  const bottomAvgReturn=periodResults.reduce((s,p)=>s+p.bottomAvg,0)/periodResults.length;
  const hitRate=(periodResults.filter(p=>p.beat).length/periodResults.length)*100;

  const refTicker=tickers[0];
  const firstDate=new Date(aligned[refTicker][startIdx].t*1000).toLocaleDateString('en-US',{month:'short',year:'numeric'});
  const lastDate=new Date(aligned[refTicker][endIdx].t*1000).toLocaleDateString('en-US',{month:'short',year:'numeric'});

  return {
    topAvgReturn, bottomAvgReturn, spread:topAvgReturn-bottomAvgReturn, hitRate,
    tickerCount:tickers.length, periodCount:periodResults.length,
    quintileSize:periodResults[0].qSize, dateRange:`${firstDate} — ${lastDate}`,
  };
}

  if(!backtestData){

  if(backtestData.loading){
    grid.innerHTML = `

    const d=r.data;
    const spreadColor = d.spread>0 ? 'var(--green)' : 'var(--red)';

    html += `

          <div style="font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:600;">${r.strategy.label}</div>

      ⚠ Price-based factors only. Survivorship bias present. No transaction costs. Not a test of the fundamentals-based composite score.
    </div>
    <div style="text-align:center;">
      <button class="refresh-btn" onclick="runBacktest()" style="background:var(--accent);color:#fff;">↻ RE-RUN BACKTEST</button>
    </div>

  grid.innerHTML = html;

async function runBacktest(){
  backtestData = { loading:true, status:'Fetching price history...', pct:0 };
  renderBacktestView();

  const histories = {};
  for(let i=0;i<TOP_100.length;i++){
    const t = TOP_100[i];
    backtestData.status = `Fetching ${t} (${i+1}/${TOP_100.length})...`;
    backtestData.pct = Math.round((i/TOP_100.length)*80);
    renderBacktestView();
    try{
      const h = await fetchYahooHistory(t);
      if(h && h.length>250) histories[t]=h;
    }catch(e){ dbg(`Yahoo ${t} error: ${e.message}`); }
    await delay(250);
  }

  backtestData.status = 'Computing all 4 strategies...';
  backtestData.pct = 90;
  renderBacktestView();

  const results = STRATEGIES.map(strategy => ({
    strategy,
    data: computeFactorBacktest(histories, strategy.scoreFn),
  }));

  backtestData = { loading:false, results };
  renderBacktestView();
}

async function loadAll(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spin');
  allData=[];
  STOCKS.forEach(s=>allData.push({stock:s,quote:null,metric:null,earnings:null,recommend:null,insiders:null,earnDate:null,sig:null}));
  renderCards();

  // Load earnings calendar once for all stocks
  dbg('Loading earnings calendar...');
  const calendar=await loadEarningsCalendar();

  // Finnhub free tier: 60 calls/min. 3 calls/stock × 21 = 63 calls.
  // Small gap keeps us safely under limit even with calendar call included.
  for(let i=0;i<STOCKS.length;i++){
    const s=STOCKS[i];
    dbg(`Loading ${s.t} (${i+1}/${STOCKS.length})...`);
    try{
      const r=await loadStock(s.t);
      const idx=allData.findIndex(d=>d.stock.t===s.t);
      if(idx>=0){
        allData[idx].quote=r.quote;
        allData[idx].metric=r.metric;
        allData[idx].earnings=r.earnings;
        allData[idx].recommend=r.recommend;
        allData[idx].insiders=r.insiders;
        allData[idx].earnDate=calendar[s.t]||null;
        const sc=score(r.quote,r.metric);
        allData[idx].sig=signal(sc);
        renderCards();
        updateSummary();
      }
    }catch(e){ dbg(`${s.t}: ${e.message}`); }
    await delay(350); // ~2.8 calls/sec = well under 60/min limit
  }

  updateSummary();
  document.getElementById('lastUpd').textContent='Updated '+now();
  btn.classList.remove('spin');
}
